name: AgeOfEmpiresIII
options:
  bundleIdPrefix: com.rebuild
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ENABLE_BITCODE: NO
    COMPRESS_PNG_FILES: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  AgeOfEmpiresIII:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
        excludes:
          - Resources/Info.plist
          - Resources/Entitlements.plist
          - Resources/GameAssets
      - path: Sources/Resources/GameAssets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: AgeOfEmpiresIII
        PRODUCT_BUNDLE_IDENTIFIER: com.rebuild.ageofempiresiii
        INFOPLIST_FILE: Sources/Resources/Info.plist
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/Entitlements.plist
      configs:
        Release:
          ONLY_ACTIVE_ARCH: NO
          SWIFT_OPTIMIZATION_LEVEL: "-O"
        Debug:
          ONLY_ACTIVE_ARCH: YES
  AgeOfEmpiresIIITests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    dependencies:
      - target: AgeOfEmpiresIII
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.rebuild.ageofempiresiii.tests
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.0"
        ARCHS: arm64
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
schemes:
  AgeOfEmpiresIII:
    build:
      targets:
        AgeOfEmpiresIII: all
        AgeOfEmpiresIIITests: [test]
    test:
      targets:
        - AgeOfEmpiresIIITests
